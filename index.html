<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FURIA DRE 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --card: #ffffff;
    --surface: #f0f1f3;
    --border: #e2e4e9;
    --accent: #d4a017;
    --accent-lo: rgba(212,160,23,0.08);
    --accent-mid: rgba(212,160,23,0.14);
    --accent-hi: rgba(212,160,23,0.22);
    --green: #16a34a;
    --red: #dc2626;
    --text: #111827;
    --text2: #6b7280;
    --text3: #9ca3af;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  /* Faixa de periodo abaixo do header */
  #period-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 18px;
    height: 36px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
  }
  #period-bar::-webkit-scrollbar { height: 3px; }
  #period-bar::-webkit-scrollbar-track { background: transparent; }
  #period-bar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
  /* HEADER */
  #header {
    height: 52px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .logo-pill {
    background: var(--accent);
    color: #000;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 0.08em;
    padding: 4px 12px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .header-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .header-sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

  .filial-group { display: flex; gap: 5px; align-items: center; }
  .filial-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 2px; white-space: nowrap; }

  .filial-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filial-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  .filial-btn:hover:not(.active) { border-color: var(--text3); color: var(--text); }

  .cc-select {
    background: #ffffff;
    border: 1px solid var(--border);
    color: #111827;
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
    outline: none;
    min-width: 130px;
    color-scheme: light;
  }
  .cc-select option { background: #ffffff; color: #111827; }

  .period-group { display: flex; gap: 4px; margin-left: auto; align-items: center; flex-shrink: 0; }
  .period-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 2px; white-space: nowrap; flex-shrink: 0; }

  .period-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 3px 9px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 500;
    transition: all 0.15s;
    user-select: none;
    white-space: nowrap;
  }
  .period-chip.active { background: rgba(212,160,23,0.15); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .period-chip:hover:not(.active) { border-color: var(--text3); color: var(--text); }

  /* MAIN LAYOUT */
  #main { display: flex; height: calc(100vh - 88px); overflow: hidden; }

  .panel { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }
  #panel-left   { width: 32%; flex-shrink: 0; }
  #panel-center { width: 28%; flex-shrink: 0; }
  #panel-right  { flex: 1; border-right: none; }

  .panel-header {
    height: 36px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    flex-shrink: 0;
  }
  .ph-badge {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text3);
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 3px;
    letter-spacing: 0.03em;
    font-weight: 600;
  }

  .panel-body { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .panel-body::-webkit-scrollbar { width: 5px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  .panel-body::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* DRE TABLE */
  .dre-table { width: 100%; border-collapse: collapse; }
  .dre-table tr { border-bottom: 1px solid #161616; }

  .dre-row-section td {
    padding: 7px 14px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    background: #f8f9fa;
  }
  .dre-row-section { border-bottom: 1px solid var(--border) !important; border-top: 1px solid var(--border) !important; }

  .dre-row-group { cursor: pointer; transition: background 0.1s; }
  .dre-row-group:hover { background: rgba(0,0,0,0.03); }
  .dre-row-group td { padding: 5px 10px 5px 14px; font-size: 12px; font-weight: 600; color: var(--text); }
  .arrow { display: inline-block; width: 12px; font-size: 9px; color: var(--text3); transition: transform 0.2s; }
  .dre-row-group.expanded .arrow { transform: rotate(90deg); }

  .dre-row-leaf td { padding: 4px 10px 4px 30px; font-size: 11px; color: var(--text2); }
  .dre-row-leaf:hover td { color: var(--text); background: rgba(0,0,0,0.02); }

  .dre-row-total { border-left: 3px solid var(--accent); border-bottom: 1px solid var(--border) !important; }
  .dre-row-total td { padding: 6px 10px 6px 13px; font-size: 12px; font-weight: 700; }

  .dre-row-total.total-receita-liq { background: var(--accent-lo);  border-left-color: rgba(245,197,24,0.40); }
  .dre-row-total.total-lucro-bruto { background: var(--accent-lo);  border-left-color: rgba(245,197,24,0.55); }
  .dre-row-total.total-ebitda      { background: var(--accent-mid); border-left-color: rgba(245,197,24,0.70); }
  .dre-row-total.total-ebit        { background: var(--accent-mid); border-left-color: rgba(245,197,24,0.85); }
  .dre-row-total.total-resultado   { background: var(--accent-hi);  border-left-color: var(--accent); border-left-width: 4px; }
  .dre-row-total.total-resultado td { font-size: 13px; font-weight: 800; }
  .dre-row-total.total-subtotal    { background: rgba(0,0,0,0.02); border-left-color: var(--text3); }

  .dre-col-name { width: 60%; }
  .dre-col-val  { width: 40%; text-align: right; font-variant-numeric: tabular-nums; padding-right: 14px !important; }

  .total-receita-liq .dre-col-name { color: rgba(245,197,24,0.70); }
  .total-lucro-bruto .dre-col-name { color: rgba(245,197,24,0.80); }
  .total-ebitda .dre-col-name      { color: rgba(245,197,24,0.90); }
  .total-ebit .dre-col-name        { color: rgba(245,197,24,0.95); }
  .total-resultado .dre-col-name   { color: var(--accent); }

  .val-pos  { color: var(--green); }
  .val-neg  { color: var(--red); }
  .val-zero { color: var(--text3); }

  /* CENTER */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi-mini { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; position: relative; overflow: hidden; }
  .kpi-mini::before { content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--accent); opacity:0.5; }
  .kpi-mini.full { grid-column: 1 / -1; }
  .kpi-mini.full::before { opacity:1; }
  .kpi-mini-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); font-weight: 700; margin-bottom: 5px; white-space: nowrap; }
  .kpi-mini-value { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-bottom: 5px; }
  .kpi-mini.full .kpi-mini-value { font-size: 24px; }
  .kpi-mini-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .center-scroll { padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 14px; }

  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .kpi-period-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text2); margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .kpi-footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kpi-variation { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; display: flex; align-items: center; gap: 3px; }
  .kpi-variation.pos { background: rgba(34,197,94,0.15); color: var(--green); }
  .kpi-variation.neg { background: rgba(239,68,68,0.15); color: var(--red); }
  .kpi-prior { font-size: 11px; color: var(--text3); }

  .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .summary-card-header { padding: 9px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.02); }

  .summary-table { width: 100%; border-collapse: collapse; }
  .summary-table tr { border-bottom: 1px solid #161616; }
  .summary-table tr:last-child { border-bottom: none; }
  .summary-table td { padding: 5px 12px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .summary-table .s-name { color: var(--text2); width: 46%; }
  .summary-table .s-val  { text-align: right; width: 34%; font-weight: 600; }
  .summary-table .s-pct  { text-align: right; width: 20%; font-size: 10px; color: var(--text3); padding-right: 14px; }

  .st-receita  { background: var(--accent-lo); }
  .st-lucro    { background: var(--accent-lo); }
  .st-ebitda   { background: var(--accent-mid); }
  .st-resultado{ background: var(--accent-hi); }

  .st-receita td, .st-receita .s-name   { font-weight: 700 !important; color: rgba(245,197,24,0.75) !important; }
  .st-lucro td,   .st-lucro .s-name     { font-weight: 700 !important; color: rgba(245,197,24,0.85) !important; }
  .st-ebitda td,  .st-ebitda .s-name    { font-weight: 700 !important; color: rgba(245,197,24,0.92) !important; }
  .st-resultado td,.st-resultado .s-name{ font-weight: 800 !important; color: var(--accent) !important; font-size: 12.5px !important; }

  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .chart-card-header { padding: 9px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.02); }
  .chart-wrap { padding: 12px; position: relative; }
  .donut-legend { display: flex; flex-wrap: wrap; gap: 5px 10px; padding: 0 12px 12px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text2); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* RIGHT */
  .right-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; height: 100%; overflow: hidden; }
  .chart-tall { flex: 55; min-height: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .chart-short{ flex: 45; min-height: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .chart-tall .chart-wrap, .chart-short .chart-wrap { flex: 1; min-height: 0; padding: 10px 12px 12px; position: relative; }
  .chart-tall .chart-wrap canvas, .chart-short .chart-wrap canvas { width: 100% !important; height: 100% !important; }
</style>
</head>
<body>

<div id="header">
  <div class="logo-pill">FURIA</div>
  <div class="header-title">Demonstração de Resultado</div>

  <div class="header-sep"></div>

  <div class="filial-group">
    <span class="filial-label">Filial</span>
    <button class="filial-btn active" data-filial="all" onclick="setFilial(this)">Consolidado</button>
  </div>

  <div class="header-sep"></div>

  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
    <span class="filial-label">CC</span>
    <select class="cc-select" id="ccSelect" onchange="onCCChange(this)">
      <option value="">Todos</option>
    </select>
  </div>

  
  </div>
</div>
<div id="period-bar"><span class="period-label">Per&#237;odo</span><div id="periodChips" style="display:flex;gap:4px;flex-wrap:nowrap;"></div></div>
<div id="main">
  <!-- LEFT: DRE Table -->
  <div class="panel" id="panel-left">
    <div class="panel-header">
      DRE Detalhado
      <span class="ph-badge" id="badgeLeft">—</span>
    </div>
    <div class="panel-body">
      <table class="dre-table" id="dreTable"></table>
    </div>
  </div>

  <!-- CENTER: KPIs + Summary + Donut -->
  <div class="panel" id="panel-center">
    <div class="panel-header">
      Resumo Executivo
      <span class="ph-badge" id="badgeCenter">—</span>
    </div>
    <div class="panel-body">
      <div class="center-scroll">
        <div class="kpi-card" id="kpiCard"></div>
        <div class="summary-card">
          <div class="summary-card-header">Métricas Principais</div>
          <table class="summary-table" id="summaryTable"></table>
        </div>
        <div class="chart-card">
          <div class="chart-card-header">Composição de Custos &amp; Despesas</div>
          <div class="chart-wrap" style="height:190px;"><canvas id="donutChart"></canvas></div>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Charts -->
  <div class="panel" id="panel-right">
    <div class="panel-header">
      Análise Temporal &amp; Centros de Custo
      <span class="ph-badge" id="badgeRight">—</span>
    </div>
    <div class="panel-body" style="padding:0;overflow:hidden;">
      <div class="right-body">
        <div class="chart-tall">
          <div class="chart-card-header">Evolução Mensal — Receita Líquida · Custo+Despesa · Resultado</div>
          <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
        </div>
        <div class="chart-short">
          <div class="chart-card-header">Top 10 Centros de Custo por Desembolso Total</div>
          <div class="chart-wrap"><canvas id="barChart"></canvas></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// EMBEDDED DATA
// ═══════════════════════════════════════════════════════════
let RAW_DATA = [];

let ALL_MONTHS = [];
let MONTH_LABELS = [];

const DRE_TREE = [
  { type:'section', label:'RECEITA BRUTA' },
  { type:'group', code:'3.1.01', label:'Rec. Serviços Nacional', children:[

  { type:'group', code:'3.1.02', label:'Rec. Serviços Exportação', children:[

  { type:'section', label:'RESULTADO FINANCEIRO' },
  { type:'group', code:'4.1.09', label:'Resultado Financeiro', children:[

    { code:'4.1.09.03', label:'Variação Cambial' },
  ]},
  { type:'total', key:'res_fin', label:'(+/-) Resultado Financeiro', cls:'total-subtotal' },

  { type:'section', label:'RESULTADO NÃO OPERACIONAL' },
  { type:'group', code:'4.2.01', label:'Resultado Não Operacional', children:[
    { code:'4.2.01.01', label:'Não Operacional' },
  ]},
  { type:'total', key:'res_nao_op', label:'(+/-) Resultado Não Operacional', cls:'total-subtotal' },
  { type:'total', key:'ebit', label:'(=) EBIT / Resultado Antes IR', cls:'total-ebit' },

  { type:'section', label:'TRIBUTOS SOBRE RESULTADO' },
  { type:'group', code:'4.4.01', label:'Provisão IRPJ/CSLL', children:[
    { code:'4.4.01.01', label:'IRPJ / CSLL' },
  ]},
  { type:'total', key:'resultado', label:'(=) Resultado Líquido', cls:'total-resultado' },
];

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const state = {
  months: [],
  cc: '',
  filial: 'all',
  collapsed: {}   // group code -> true(collapsed) / false(expanded). Default: collapsed.
};

const charts = { donut: null, line: null, bar: null };

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
function init() {
  // CC dropdown
  const ccs = [...new Set(RAW_DATA.map(r => r.cc))].sort();
  const sel = document.getElementById('ccSelect');
  ccs.forEach(cc => {
    const o = document.createElement('option');
    o.value = cc; o.textContent = cc;
    sel.appendChild(o);
  });

  // Period chips
  const wrap = document.getElementById('periodChips');
  ALL_MONTHS.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'period-chip active';
    el.textContent = MONTH_LABELS[i];
    el.dataset.month = m;
    el.onclick = () => toggleMonth(m, el);
    wrap.appendChild(el);
  });

  render();
}

function setFilial(btn) {
  document.querySelectorAll('.filial-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.filial = btn.dataset.filial;
  render();
}

function toggleMonth(m, el) {
  if (state.months.includes(m)) {
    if (state.months.length === 1) return;
    state.months = state.months.filter(x => x !== m);
    el.classList.remove('active');
  } else {
    state.months = [...state.months, m].sort();
    el.classList.add('active');
  }
  render();
}

function onCCChange(sel) {
  state.cc = sel.value;
  render();
}

// ═══════════════════════════════════════════════════════════
// DATA HELPERS
// ═══════════════════════════════════════════════════════════
function filterData(months, cc) {
  return RAW_DATA.filter(r =>
    months.includes(r.m) && (!cc || r.cc === cc) && (state.filial === 'all' || r.f === state.filial)
  );
}

function sumAcc(data, prefix) {
  return data
    .filter(r => r.c === prefix || r.c.startsWith(prefix + '.'))
    .reduce((s, r) => s + r.cr - r.d, 0);
}

function sumAccs(data, prefixes) {
  return prefixes.reduce((s, p) => s + sumAcc(data, p), 0);
}

function computeDRE(data) {
  const receita_bruta = sumAccs(data, ['3.1.01.01','3.1.01.02','3.1.01.03','3.1.02.01','3.1.02.02','3.1.02.03','3.1.03.01','3.1.04.01']);
  const deducoes      = sumAccs(data, ['3.1.01.04','3.1.02.04','3.1.03.02','3.1.04.02']);
  const receita_liq   = receita_bruta + deducoes;
  const custo_servicos= sumAcc(data, '5');
  const lucro_bruto   = receita_liq + custo_servicos;
  const despesas_op   = sumAccs(data, ['4.1.01','4.1.02','4.1.03','4.1.04','4.1.05','4.1.06','4.1.07','4.1.08']);
  const ebitda        = lucro_bruto + despesas_op;
  const res_fin       = sumAcc(data, '4.1.09');
  const res_nao_op    = sumAcc(data, '4.2');
  const ebit          = ebitda + res_fin + res_nao_op;
  const irpj          = sumAcc(data, '4.4');
  const resultado     = ebit + irpj;
  return { receita_bruta, deducoes, receita_liq, custo_servicos, lucro_bruto, despesas_op, ebitda, res_fin, res_nao_op, ebit, irpj, resultado };
}

// ═══════════════════════════════════════════════════════════
// FORMAT
// ═══════════════════════════════════════════════════════════
function fmt(v, short) {
  if (short) {
    const a = Math.abs(v);
    let s = a >= 1e6 ? (v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'M'
           : a >= 1e3 ? (v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'K'
           : v.toLocaleString('pt-BR',{maximumFractionDigits:0});
    return 'R$ '+s;
  }
  return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function vc(v) { return v > 0 ? 'val-pos' : v < 0 ? 'val-neg' : 'val-zero'; }

function pct(v, base) {
  if (!base) return '—';
  return Math.abs(v/base*100).toFixed(1)+'%';
}

function periodLabel() {
  const ms = [...state.months].sort();
  if (ms.length === 1) return MONTH_LABELS[ALL_MONTHS.indexOf(ms[0])];
  return MONTH_LABELS[ALL_MONTHS.indexOf(ms[0])] + ' – ' + MONTH_LABELS[ALL_MONTHS.indexOf(ms[ms.length-1])];
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render() {
  const data = filterData(state.months, state.cc);
  const dre  = computeDRE(data);
  const lbl  = periodLabel();

  document.getElementById('badgeLeft').textContent   = lbl;
  document.getElementById('badgeCenter').textContent = lbl;
  document.getElementById('badgeRight').textContent  = lbl;

  renderDRE(data, dre);
  renderKPI(dre, lbl);
  renderSummary(dre);
  renderDonut(data);
  renderLine();
  renderBar();
}

// ── LEFT: DRE TABLE ─────────────────────────────────────
function renderDRE(data, dre) {
  const tbody = document.getElementById('dreTable');
  const rows  = [];

  const totals = {
    deducoes:    dre.deducoes,
    receita_liq: dre.receita_liq,
    lucro_bruto: dre.lucro_bruto,
    ebitda:      dre.ebitda,
    res_fin:     dre.res_fin,
    res_nao_op:  dre.res_nao_op,
    ebit:        dre.ebit,
    resultado:   dre.resultado,
  };

  DRE_TREE.forEach(item => {
    if (item.type === 'section') {
      rows.push(`<tr class="dre-row-section"><td colspan="2">${item.label}</td></tr>`);
      return;
    }

    if (item.type === 'total') {
      const v = totals[item.key] || 0;
      rows.push(`<tr class="dre-row-total ${item.cls}"><td class="dre-col-name">${item.label}</td><td class="dre-col-val ${vc(v)}">${fmt(v)}</td></tr>`);
      return;
    }

    if (item.type === 'group') {
      const codes = (item.children || []).map(c => c.code);
      const total = codes.reduce((s, c) => s + sumAcc(data, c), 0);
      const expanded = state.collapsed[item.code] === false;

      rows.push(`<tr class="dre-row-group ${expanded ? 'expanded' : ''}" onclick="toggleGroup('${item.code}')">
        <td class="dre-col-name"><span class="arrow">▶</span> ${item.label}</td>
        <td class="dre-col-val ${vc(total)}">${fmt(total)}</td>
      </tr>`);

      if (expanded && item.children) {
        item.children.forEach(child => {
          const cv = sumAcc(data, child.code);
          if (cv === 0 && !data.some(r => r.c === child.code)) return;
          rows.push(`<tr class="dre-row-leaf">
            <td class="dre-col-name">${child.label}</td>
            <td class="dre-col-val ${vc(cv)}">${fmt(cv)}</td>
          </tr>`);
        });
      }
    }
  });

  tbody.innerHTML = rows.join('');
}

function toggleGroup(code) {
  state.collapsed[code] = (state.collapsed[code] === false) ? true : false;
  const data = filterData(state.months, state.cc);
  renderDRE(data, computeDRE(data));
}

// ── CENTER: KPI ──────────────────────────────────────────
function renderKPI(dre, lbl) {
  const ms      = [...state.months].sort();
  const lastIdx = ALL_MONTHS.indexOf(ms[ms.length - 1]);
  const n       = ms.length;
  let priorDre  = null;

  if (lastIdx >= n) {
    const priorMs = ALL_MONTHS.slice(lastIdx - n, lastIdx);
    priorDre = computeDRE(filterData(priorMs, state.cc));
  }

  function mkVar(cur, prior) {
    if (prior === null || prior === undefined) return '<span class="kpi-prior">Sem per. anterior</span>';
    if (prior === 0) return '<span class="kpi-prior">—</span>';
    const p   = (cur - prior) / Math.abs(prior) * 100;
    const cls = p >= 0 ? 'pos' : 'neg';
    const arr = p >= 0 ? '▲' : '▼';
    return '<span class="kpi-variation '+cls+'">'+arr+' '+Math.abs(p).toFixed(1)+'%</span><span class="kpi-prior">Ant.: '+fmt(prior, true)+'</span>';
  }

  const cards = [
    { label:'Receita Bruta',    val:dre.receita_bruta,  prior:priorDre && priorDre.receita_bruta,  full:false },
    { label:'Lucro Bruto',      val:dre.lucro_bruto,    prior:priorDre && priorDre.lucro_bruto,    full:false },
    { label:'Custo Servicos',   val:dre.custo_servicos, prior:priorDre && priorDre.custo_servicos, full:false },
    { label:'Despesas Operac.', val:dre.despesas_op,    prior:priorDre && priorDre.despesas_op,    full:false },
    { label:'Resultado Liquido — '+lbl, val:dre.resultado, prior:priorDre && priorDre.resultado, full:true },
  ];

  document.getElementById('kpiCard').innerHTML =
    '<div class="kpi-grid">' +
    cards.map(function(c) {
      return '<div class="kpi-mini'+(c.full?' full':'')+'">' +
        '<div class="kpi-mini-label">'+c.label+'</div>' +
        '<div class="kpi-mini-value '+vc(c.val)+'">'+fmt(c.val)+'</div>' +
        '<div class="kpi-mini-footer">'+mkVar(c.val, c.prior)+'</div>' +
        '</div>';
    }).join('') +
    '</div>';
}
// ── CENTER: SUMMARY TABLE ────────────────────────────────
function renderSummary(dre) {
  const rb = dre.receita_bruta;
  const rows = [
    { label:'Receita Bruta',           v:dre.receita_bruta,  cls:'' },
    { label:'(-) Deduções',            v:dre.deducoes,        cls:'' },
    { label:'(=) Receita Líquida',     v:dre.receita_liq,    cls:'st-receita' },
    { label:'(-) Custo dos Serviços',  v:dre.custo_servicos, cls:'' },
    { label:'(=) Lucro Bruto',         v:dre.lucro_bruto,    cls:'st-lucro' },
    { label:'(-) Despesas Operac.',    v:dre.despesas_op,     cls:'' },
    { label:'(=) EBITDA',              v:dre.ebitda,          cls:'st-ebitda' },
    { label:'(+/-) Res. Financeiro',   v:dre.res_fin,         cls:'' },
    { label:'(-) IRPJ/CSLL',           v:dre.irpj,            cls:'' },
    { label:'(=) Resultado Líquido',   v:dre.resultado,       cls:'st-resultado' },
  ];

  document.getElementById('summaryTable').innerHTML = rows.map(r => {
    const pctStr = r.v === rb ? '100%' : pct(r.v, rb);
    return `<tr class="${r.cls}">
      <td class="s-name">${r.label}</td>
      <td class="s-val ${vc(r.v)}">${fmt(r.v)}</td>
      <td class="s-pct">${pctStr}</td>
    </tr>`;
  }).join('');
}

// ── CENTER: DONUT ────────────────────────────────────────
function renderDonut(data) {
  const segs = [
    { label:'Lineups',       code:'5.1.02', color:'#f5c518' },
    { label:'Colaboradores', code:'4.1.01', color:'#e8934a' },
    { label:'Produção',      code:'5.1.05', color:'#e05c6b' },
    { label:'Administrativo',code:'4.1.05', color:'#b854b5' },
    { label:'Consultoria',   code:'4.1.02', color:'#6366f1' },
    { label:'Marketing (D)', code:'4.1.03', color:'#22d3ee' },
    { label:'Streamers',     code:'5.1.03', color:'#34d399' },
    { label:'Viagens (C)',   code:'5.1.04', color:'#94a3b8' },
    { label:'Viagens (D)',   code:'4.1.04', color:'#64748b' },
    { label:'Fin. (abs)',    code:'4.1.09', color:'#475569' },
    { label:'Revenda',       code:'5.1.01', color:'#334155' },
    { label:'Projetos',      code:'5.1.06', color:'#1e293b' },
  ];

  const vals   = segs.map(s => Math.abs(sumAcc(data, s.code)));
  const total  = vals.reduce((a, b) => a + b, 0);

  if (charts.donut) { charts.donut.destroy(); charts.donut = null; }
  charts.donut = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: {
      labels: segs.map(s => s.label),
      datasets: [{ data: vals, backgroundColor: segs.map(s => s.color), borderWidth: 0, hoverOffset: 8 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor:'#ffffff', borderColor:'#e2e4e9', borderWidth:1, titleColor:'#111827', bodyColor:'#6b7280',
          callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.raw,true)} (${(ctx.raw/total*100).toFixed(1)}%)` }
        }
      }
    }
  });

  document.getElementById('donutLegend').innerHTML = segs
    .filter((_, i) => vals[i] > 0)
    .map((s, i) => `<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div><span>${s.label}</span></div>`).join('');
}

// ── RIGHT: LINE CHART ─────────────────────────────────────
function renderLine() {
  const ms     = [...state.months].sort();
  const labels = ms.map(m => MONTH_LABELS[ALL_MONTHS.indexOf(m)]);

  const rlPts  = ms.map(m => computeDRE(filterData([m], state.cc)).receita_liq);
  const cdPts  = ms.map(m => { const d = computeDRE(filterData([m], state.cc)); return d.custo_servicos + d.despesas_op; });
  const resPts = ms.map(m => computeDRE(filterData([m], state.cc)).resultado);

  if (charts.line) { charts.line.destroy(); charts.line = null; }

  charts.line = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label:'Receita Líquida', data:rlPts,  borderColor:'#374151', backgroundColor:'rgba(0,0,0,0.03)', fill:true,  tension:0.35, pointRadius:4, pointBackgroundColor:'#374151', pointBorderColor:'#ffffff', pointBorderWidth:2, borderWidth:1.5 },
        { label:'Custo+Despesa',   data:cdPts,  borderColor:'#f87171',               backgroundColor:'rgba(220,38,38,0.06)',  fill:true,  tension:0.35, pointRadius:4, pointBackgroundColor:'#f87171',               pointBorderColor:'#ffffff', pointBorderWidth:2, borderWidth:1.5 },
        { label:'Resultado Líq.',  data:resPts, borderColor:'#f5c518',               backgroundColor:'rgba(212,160,23,0.08)',   fill:true,  tension:0.35, pointRadius:5, pointBackgroundColor:'#f5c518',               pointBorderColor:'#ffffff', pointBorderWidth:2, borderWidth:2 },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins: {
        legend:{ display:true, position:'top', labels:{ color:'#7a8694', boxWidth:12, boxHeight:2, padding:14, font:{size:11} } },
        tooltip:{ backgroundColor:'#ffffff', borderColor:'#e2e4e9', borderWidth:1, titleColor:'#111827', bodyColor:'#6b7280',
          callbacks:{ label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.raw,true)}` }
        }
      },
      scales:{
        x:{ grid:{color:'#161616'}, ticks:{color:'#9ca3af',font:{size:11}}, border:{color:'#232323'} },
        y:{ grid:{color:'#161616'}, ticks:{color:'#9ca3af',font:{size:10},callback:v=>fmt(v,true)}, border:{color:'#232323'} }
      }
    },
    plugins:[{
      id:'ptLabels',
      afterDatasetsDraw(ch) {
        const ctx2 = ch.ctx;
        ch.data.datasets.forEach((ds, di) => {
          ch.getDatasetMeta(di).data.forEach((pt, i) => {
            const v = ds.data[i]; if(v==null) return;
            const a = Math.abs(v);
            const t = a>=1e6?(v/1e6).toFixed(1)+'M':a>=1e3?(v/1e3).toFixed(0)+'K':v.toFixed(0);
            ctx2.save(); ctx2.font='bold 9px system-ui'; ctx2.fillStyle=ds.borderColor;
            ctx2.textAlign='center'; ctx2.fillText(t, pt.x, pt.y-10); ctx2.restore();
          });
        });
      }
    }]
  });
}

// ── RIGHT: BAR CHART ─────────────────────────────────────
function renderBar() {
  const data = filterData(state.months, state.cc);
  const ccs  = [...new Set(data.map(r => r.cc))];

  const ccTotals = ccs.map(cc => ({
    cc,
    val: data.filter(r => r.cc === cc && (r.c.startsWith('4.') || r.c.startsWith('5.')))
             .reduce((s, r) => s + Math.abs(r.cr - r.d), 0)
  })).filter(x => x.val > 0).sort((a, b) => b.val - a.val).slice(0, 10);

  if (charts.bar) { charts.bar.destroy(); charts.bar = null; }

  const n = ccTotals.length;
  const gradBg = ccTotals.map((_, i) => {
    const t = i / Math.max(n - 1, 1);
    const alpha = 0.90 - t * 0.35;
    return `rgba(245,197,24,${alpha.toFixed(2)})`;
  });

  charts.bar = new Chart(document.getElementById('barChart'), {
    type:'bar',
    data:{
      labels: ccTotals.map(x => x.cc),
      datasets:[{ data: ccTotals.map(x => x.val), backgroundColor: gradBg, borderRadius:3, borderSkipped:false }]
    },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{ backgroundColor:'#ffffff', borderColor:'#e2e4e9', borderWidth:1, titleColor:'#111827', bodyColor:'#6b7280',
          callbacks:{label:ctx=>` ${fmt(ctx.raw,true)}`}
        }
      },
      scales:{
        x:{ grid:{color:'#161616'}, ticks:{color:'#9ca3af',font:{size:10},callback:v=>fmt(v,true)}, border:{color:'#232323'} },
        y:{ grid:{display:false},   ticks:{color:'#bbb',font:{size:11}}, border:{color:'#232323'} }
      }
    },
    plugins:[{
      id:'barLabels',
      afterDatasetsDraw(ch) {
        const ctx2 = ch.ctx; const meta = ch.getDatasetMeta(0);
        meta.data.forEach((bar, i) => {
          const v = ch.data.datasets[0].data[i];
          const a = Math.abs(v);
          const t = a>=1e6?(v/1e6).toFixed(1)+'M':a>=1e3?(v/1e3).toFixed(0)+'K':v.toFixed(0);
          ctx2.save(); ctx2.font='bold 9px system-ui'; ctx2.fillStyle='#999';
          ctx2.textAlign='left'; ctx2.fillText(t, bar.x+5, bar.y+4); ctx2.restore();
        });
      }
    }]
  });
}

fetch('data.json')
  .then(function(r){ if(!r.ok) throw new Error('data.json nao encontrado'); return r.json(); })
  .then(function(data){
    RAW_DATA = data;
    var _mn = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    ALL_MONTHS = Array.from(new Set(data.map(function(r){return r.m;}))).sort(function(a,b){
      var pa=a.split('/'), pb=b.split('/');
      var ma=+pa[0],ya=+pa[1],mb=+pb[0],yb=+pb[1];
      return ya!==yb ? ya-yb : ma-mb;
    });
    MONTH_LABELS = ALL_MONTHS.map(function(m){
      var p=m.split('/'); return _mn[+p[0]-1]+'/'+p[1].slice(2);
    });
    state.months = ALL_MONTHS.slice();
    var _filiais = Array.from(new Set(data.map(function(r){return r.f||'';})).values()).filter(Boolean).sort();
    var _fg = document.querySelector('.filial-group');
    _fg.innerHTML = '<span class="filial-label">Filial</span><button class="filial-btn active" data-filial="all" onclick="setFilial(this)">Consolidado</button>';
    _filiais.forEach(function(f){
      var _b = document.createElement('button');
      _b.className = 'filial-btn';
      _b.dataset.filial = f;
      _b.setAttribute('onclick','setFilial(this)');
      _b.textContent = f;
      _fg.appendChild(_b);
    });
    init();
  })
  .catch(function(err){
    document.body.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#dc2626">Erro ao carregar dados: '+err.message+'</div>';
  });
